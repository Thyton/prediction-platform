name: cycle

on:
  schedule:
    # full pass: grade, learn, collect, model, publish
    - cron: "6,36 * * * *"
    # live signals only, every 5 min, so in-play get-in/get-out is usable.
    # A no-op when nothing on the board is live.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      live_only:
        description: "Signals only (skip collect/model)"
        type: boolean
        default: false

concurrency:
  group: cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide mode
        id: mode
        run: |
          # GitHub's scheduler fires unreliably on this account (proven: hours of
          # silence), so the mode is decided by data staleness, not by the clock.
          # A board older than 25 minutes always gets a full pass; anything fresher
          # is a live-signals-only run. Whatever fires, the right work happens.
          FULL=0
          if [ "${{ inputs.live_only }}" = "true" ]; then
            FULL=0
          else
            AGE=$(python - <<'PY'
import json, datetime, sys
try:
    g = json.load(open("data/state.json")).get("generatedAt") or ""
    t = datetime.datetime.fromisoformat(g)
    if not t.tzinfo:
        t = t.replace(tzinfo=datetime.UTC)
    print(int((datetime.datetime.now(datetime.UTC) - t).total_seconds() // 60))
except Exception:
    print(999)
PY
)
            echo "board age: ${AGE}m" >> "$GITHUB_STEP_SUMMARY"
            if [ "$AGE" -ge 25 ]; then FULL=1; fi
          fi
          if [ "$FULL" = "1" ]; then echo "live=" >> "$GITHUB_OUTPUT"
          else echo "live=--live" >> "$GITHUB_OUTPUT"; fi

      - name: Run engine
        working-directory: engine
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -X utf8 cycle.py ${{ steps.mode.outputs.live }}

      - name: Chain the next run
        # GitHub's scheduler regularly misses slots here. A run re-queuing the
        # next one turns the pipeline into its own heartbeat: ~30 min after a
        # full pass, ~5 min after a live pass. Manual dispatch does not chain.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.mode.outputs.live }}" = "" ]; then SLEEP=1800; else SLEEP=300; fi
          echo "next run in ${SLEEP}s" >> "$GITHUB_STEP_SUMMARY"
          sleep $SLEEP
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/cycle.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Commit data
        if: always()
        run: |
          git config user.name  "tiplab-bot"
          git config user.email "bot@tiplab.io"
          git add data engine/model_state.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "cycle: $(date -u +%FT%TZ)"
            git push
          fi

# eof
