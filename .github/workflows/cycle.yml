name: cycle

on:
  schedule:
    # Backstop only: the scheduler here is unreliable (hours of silence seen), so
    # every run queues the next itself (see "Chain the next run"). This cron just
    # restarts the heartbeat within the hour if the chain ever breaks.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      live_only:
        description: "Signals only (skip collect/model)"
        type: boolean
        default: false

concurrency:
  group: cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide mode
        id: mode
        # GitHub's scheduler fires unreliably on this account (hours of silence
        # seen), so the mode is decided by how stale the board is, not by the
        # clock: older than 25 minutes gets a full pass, fresher is live-only.
        # Whatever fires, the right work happens.
        run: |
          FULL=0
          if [ "${{ inputs.live_only }}" = "true" ]; then
            FULL=0
          else
            AGE=$(python -X utf8 -c "import json,datetime;t=json.load(open('data/state.json'))['generatedAt'];d=datetime.datetime.fromisoformat(t);d=(d if d.tzinfo else d.replace(tzinfo=datetime.UTC));print(int((datetime.datetime.now(datetime.UTC)-d).total_seconds()//60))" 2>/dev/null || echo 999)
            echo "board age: ${AGE}m" >> "$GITHUB_STEP_SUMMARY"
            if [ "$AGE" -ge 25 ]; then FULL=1; fi
          fi
          if [ "$FULL" = "1" ]; then echo "live=" >> "$GITHUB_OUTPUT"
          else echo "live=--live" >> "$GITHUB_OUTPUT"; fi
          if [ "$FULL" = "1" ]; then echo "live=" >> "$GITHUB_OUTPUT"
          else echo "live=--live" >> "$GITHUB_OUTPUT"; fi

      - name: Run engine
        working-directory: engine
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -X utf8 cycle.py ${{ steps.mode.outputs.live }}

      - name: Chain the next run
        # GitHub's scheduler regularly misses slots here. A run re-queuing the
        # next one turns the pipeline into its own heartbeat: ~30 min after a
        # full pass, ~5 min after a live pass. Manual dispatch does not chain.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.mode.outputs.live }}" = "" ]; then SLEEP=1800; else SLEEP=300; fi
          echo "next run in ${SLEEP}s" >> "$GITHUB_STEP_SUMMARY"
          sleep $SLEEP
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/cycle.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Commit data
        if: always()
        run: |
          git config user.name  "tiplab-bot"
          git config user.email "bot@tiplab.io"
          git add data engine/model_state.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "cycle: $(date -u +%FT%TZ)"
            git push
          fi

# eof
