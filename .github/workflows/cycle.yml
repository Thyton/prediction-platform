name: cycle

on:
  schedule:
    # Backstop only: the scheduler here is unreliable (hours of silence seen), so
    # every run queues the next itself (see "Chain the next run"). Publish.py also
    # refuses to exceed the daily API quota, so a missed slot costs freshness,
    # never budget.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      live_only:
        description: "Signals only (skip collect/model)"
        type: boolean
        default: false

concurrency:
  group: cycle
  cancel-in-progress: false

permissions:
  contents: write
  # the chain step dispatches this same workflow, which needs its own write scope
  actions: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    # The chain step sleeps up to 30 minutes before dispatching the next run,
    # so the job needs to outlive that plus the work itself. 20 minutes was
    # cancelling runs mid-sleep and breaking the heartbeat.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide mode
        id: mode
        # GitHub's scheduler fires unreliably on this account (hours of silence
        # seen), so the mode is decided by how stale the board is, not by the
        # clock: older than 25 minutes gets a full pass, fresher is live-only.
        # Whatever fires, the right work happens.
        run: |
          FULL=0
          if [ "${{ inputs.live_only }}" = "true" ]; then
            FULL=0
          else
            AGE=$(python -X utf8 -c "import json,datetime;t=json.load(open('data/state.json'))['generatedAt'];d=datetime.datetime.fromisoformat(t);d=(d if d.tzinfo else d.replace(tzinfo=datetime.UTC));print(int((datetime.datetime.now(datetime.UTC)-d).total_seconds()//60))" 2>/dev/null || echo 999)
            echo "board age: ${AGE}m" >> "$GITHUB_STEP_SUMMARY"
            if [ "$AGE" -ge 25 ]; then FULL=1; fi
          fi
          if [ "$FULL" = "1" ]; then echo "live=" >> "$GITHUB_OUTPUT"
          else echo "live=--live" >> "$GITHUB_OUTPUT"; fi
          if [ "$FULL" = "1" ]; then echo "live=" >> "$GITHUB_OUTPUT"
          else echo "live=--live" >> "$GITHUB_OUTPUT"; fi

      - name: Run engine
        working-directory: engine
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # notify_alerts() posts to /api/alerts, which rejects a call without this
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          EMAIL_FROM: TipLab <updates@tiplab.io>
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -X utf8 cycle.py ${{ steps.mode.outputs.live }}

      - name: Commit data
        if: always()
        run: |
          git config user.name  "tiplab-bot"
          git config user.email "bot@tiplab.io"
          git add data engine/model_state.json
          if git diff --staged --quiet; then
            echo "no change"; exit 0
          fi
          git commit -q -m "cycle: $(date -u +%FT%TZ)"
          # Another push (a human, or a chained run) can land while this job is
          # running. Rebase onto it and retry rather than losing the pass; the
          # data files are regenerated wholesale each cycle so a rebase is safe.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 5))
            git pull --rebase --autostash origin main || true
          done
          echo "::warning::data push failed after 5 attempts — next run will redo the work"
          exit 0

      - name: Chain the next run
        # GitHub's scheduler regularly misses slots here. A run re-queuing the
        # next one turns the pipeline into its own heartbeat: ~30 min after a
        # full pass, ~5 min after a live pass. Manual dispatch does not chain.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Hobby allows 100 API deploys/day and every live pass deploys, so the
          # cadence is set to fit: a live pass is cheap but only worth doing when
          # something is on, and publish.py already skips a live deploy within
          # 4 minutes of the last one. 20 min live / 30 min full is ~75-85/day.
          if [ "${{ steps.mode.outputs.live }}" = "" ]; then SLEEP=1800; else SLEEP=1200; fi
          echo "next run in ${SLEEP}s" >> "$GITHUB_STEP_SUMMARY"
          sleep $SLEEP
          CODE=$(curl -sS -o /tmp/d.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/cycle.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch status: $CODE" >> "$GITHUB_STEP_SUMMARY"
          # 204 is the only success; anything else means the heartbeat just died
          if [ "$CODE" != "204" ]; then
            cat /tmp/d.json >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

# eof
